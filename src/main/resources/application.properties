spring.application.name=leave-management

# =========================================================
# Database Configuration (H2 In-Memory for Easy Demo / Interview)
# =========================================================
spring.datasource.url=jdbc:h2:mem:leave_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MySQL Configuration (Uncomment to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/leave_management
# spring.datasource.username=root
# spring.datasource.password=mayank13
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration (24 hours expiration)
jwt.secret=ThisIsMyVerySecretKeyForLeaveManagementSystem2026
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.leave.leavemanagement=DEBUG